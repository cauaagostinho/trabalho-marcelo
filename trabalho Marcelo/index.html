<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Açougue Savegnago</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        padding: 0;
    }

    header {
        background-color: #d71920; /* vermelho Savegnago */
        color: white;
        text-align: center;
        padding: 20px;
    }

    header h1 {
        margin: 0;
    }

    .container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        padding: 20px;
    }

    .card {
        background-color: white;
        width: 250px;
        margin: 15px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        overflow: hidden;
        transition: 0.3s;
    }

    .card:hover {
        transform: scale(1.05);
    }

    .card img {
        width: 100%;
        height: 180px;
        object-fit: cover;
    }

    .card-content {
        padding: 15px;
    }

    .card h3 {
        margin: 0;
        color: #d71920;
    }

    .descricao {
        font-size: 14px;
        color: #555;
        margin: 10px 0;
    }

    .preco {
        font-size: 18px;
        font-weight: bold;
        color: #ffcc00; /* amarelo */
    }

    footer {
        background-color: #d71920;
        color: white;
        text-align: center;
        padding: 10px;
        margin-top: 20px;
    }
</style>
</head>

<body>

<header>
    <h1>Açougue Savegnago</h1>
    <p>Qualidade e tradição em carnes</p>
</header>

<div class="container">

    
   

    <!-- Produto 4 -->
    <div class="card">
        <img src="https://images.unsplash.com/photo-1600891964599-f61ba0e24092" alt="Frango">
        <div class="card-content">
            <h3>Frango Inteiro</h3>
            <p class="descricao">Fresco e selecionado, ótimo para o dia a dia.</p>
            <p class="preco">R$ 14,90/kg</p>
        </div>
    </div>

</div>

<footer>
    <p>© 2026 Açougue Savegnago</p>
</footer>

</body>
</html>
